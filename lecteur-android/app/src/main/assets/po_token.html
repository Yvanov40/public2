<script>
/* Génération du jeton anti-robot de YouTube (BotGuard), même principe que NewPipe / BgUtils. */
function base64ToU8(base64) {
  let b = base64.replace(/-/g, '+').replace(/_/g, '/').replace(/\./g, '=');
  while (b.length % 4) b += '=';
  const bin = atob(b);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function u8ToBase64(u8, urlSafe) {
  let bin = '';
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  let b = btoa(bin);
  if (urlSafe) b = b.replace(/\+/g, '-').replace(/\//g, '_');
  return b;
}

async function runBotGuard(challengeData) {
  const js = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
  if (!js) throw new Error('interpréteur BotGuard absent');
  new Function(js)();
  const vm = globalThis[challengeData.globalName];
  if (!vm || !vm.a) throw new Error('machine BotGuard introuvable');
  let fns = null;
  const callback = (asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) => {
    fns = { asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction };
  };
  await vm.a(challengeData.program, callback, true, undefined, () => {}, [[], []])[0];
  const start = Date.now();
  while (!fns && Date.now() - start < 5000) await new Promise(r => setTimeout(r, 20));
  if (!fns || !fns.asyncSnapshotFunction) throw new Error('fonction de capture absente');
  const webPoSignalOutput = [];
  const botguardResponse = await new Promise((resolve) => {
    fns.asyncSnapshotFunction((r) => resolve(r), [undefined, undefined, webPoSignalOutput, undefined]);
  });
  return { webPoSignalOutput, botguardResponse };
}

async function obtainMinter(webPoSignalOutput, integrityTokenU8) {
  const getMinter = webPoSignalOutput[0];
  if (!getMinter) throw new Error('PMD:Undefined');
  const mint = await getMinter(integrityTokenU8);
  if (!(mint instanceof Function)) throw new Error('APF:Failed');
  return async (identifierU8) => {
    const r = await mint(identifierU8);
    if (!r) throw new Error('YNJ:Undefined');
    if (!(r instanceof Uint8Array)) throw new Error('ODM:Invalid');
    return r;
  };
}
