<!doctype html>
<!-- ==================================================================================
     index.html — « Cahier de classe »
     Adresse : https://yvanov40.github.io/public2/
     Cette page ne contient que la structure (HTML) et l'apparence (CSS).
     Le comportement est dans trois fichiers JavaScript chargés tout en bas :
       core.js     : données, calcul automatique de la programmation, outils communs
       vues-a.js   : aujourd'hui, cahier journal, séance, emploi du temps, programmation
       vues-b.js   : agenda, hors classe et 108 h, élèves, évaluations, bilans, appel, administratif, réglages
     Toutes les données restent dans le navigateur de l'appareil (rien n'est envoyé sur GitHub).
     ================================================================================== -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahier de classe</title>
<meta name="theme-color" content="#27433d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
/* Les couleurs : l'ardoise (menu), le papier, l'encre bleue, les lignes Seyès, la marge rouge, la craie jaune. */
/* Les six premières se règlent dans Réglages › Apparence ; les suivantes s'en déduisent toutes seules. */
:root{color-scheme:light;--ardoise:#27433d;--fond:#eceef7;--papier:#fcfdff;--encre:#1b2c66;--marge:#d5334b;--jaune:#f2c230;
  --craie:#f1efe2;--champ:#fff;--taille:16px;--ok:#23795b;
  --ardoise2:color-mix(in srgb,var(--ardoise) 76%,#000);--ligne:color-mix(in srgb,var(--encre) 18%,var(--papier));--bord:color-mix(in srgb,var(--encre) 24%,var(--papier));
  --gris:color-mix(in srgb,var(--encre) 68%,var(--papier));--teinte:color-mix(in srgb,var(--encre) 8%,var(--papier));--teinte2:color-mix(in srgb,var(--encre) 13%,var(--papier));
  --titre:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--texte:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html{height:100%;font-size:var(--taille)}
body{margin:0;min-height:100%;background:var(--fond);color:var(--encre);font:1rem/1.5 var(--texte);display:grid;grid-template-columns:232px 1fr;grid-template-rows:auto 1fr}
h1,h2,h3{font-family:var(--titre);line-height:1.15;margin:0}
h1{font-size:1.7rem;font-weight:700}h2{font-size:1.25rem;font-weight:700}h3{font-size:1.02rem;font-weight:700}
p{margin:.4em 0}a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}
[hidden]{display:none!important}

/* Le menu : une ardoise à gauche (en bas sur téléphone). */
#nav{grid-row:1/3;background:var(--ardoise);color:var(--craie);padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
#nav .logo{font:700 1.3rem var(--titre);padding:0 10px 14px;letter-spacing:-.01em}
#nav .logo small{display:block;font:400 .8rem var(--texte);opacity:.75}
#nav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;font-size:.98rem}
#nav button:hover{background:var(--ardoise2)}
#nav button[aria-current]{background:var(--craie);color:var(--ardoise);font-weight:700}
#nav button:focus-visible{outline:3px solid var(--jaune)}
#nav .ic{width:1.4em;text-align:center}

#top{background:var(--papier);border-bottom:1px solid var(--bord);padding:10px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
#top .sp{flex:1}
#main{padding:22px;min-width:0;max-width:1180px;width:100%}

/* Les boutons et champs. */
.btn{border:1.5px solid var(--encre);background:var(--papier);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.92rem;white-space:nowrap}
.btn:hover{background:var(--teinte2)}
.btn.pri{background:var(--encre);color:var(--papier)}.btn.pri:hover{background:color-mix(in srgb,var(--encre) 82%,var(--papier))}
.btn.danger{border-color:var(--marge);color:var(--marge)}
.btn.sm{padding:3px 8px;font-size:.82rem}
.btn.ghost{border-color:transparent;font-weight:400;text-decoration:underline}
.lnk{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ligne);text-underline-offset:3px}
.lnk:hover{text-decoration-color:var(--encre)}.lnk:focus-visible{outline:3px solid var(--jaune)}
input,select,textarea{border:1.5px solid var(--bord);border-radius:7px;padding:6px 9px;background:var(--champ);max-width:100%}
textarea{width:100%;resize:vertical;min-height:2.6em}
input[type=checkbox]{width:1.15em;height:1.15em;accent-color:var(--encre);vertical-align:-2px}
.fld{display:block;margin:.55em 0}.fld>span{display:block;font-size:.85rem;color:var(--gris);margin-bottom:2px}
.fld input:not([type=checkbox]),.fld select{width:100%}
.chk{display:block;margin:.55em 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{margin-top:14px}.sp{flex:1}
.cap{margin-bottom:12px}.cap::first-letter{text-transform:uppercase}
.muted{color:var(--gris)}.small{font-size:.86rem}
.warn{color:var(--marge);font-weight:700}

/* La feuille de cahier : marge rouge à gauche, c'est la signature de l'appli. */
.sheet{background:var(--papier);border:1px solid var(--bord);border-radius:4px 12px 12px 4px;padding:16px 18px 16px 76px;margin:0 0 16px;position:relative}
.sheet::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--marge);opacity:.75}
.sheet>.mg{position:absolute;left:0;width:60px;text-align:right;font:700 .82rem var(--titre);color:var(--gris);line-height:1.25;padding-top:2px}
.sheet.flat{padding-left:18px}.sheet.flat::before{display:none}
.sheet h2+*,.sheet h3+*{margin-top:8px}
.head{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:0 0 16px;padding-bottom:10px;
  background:repeating-linear-gradient(to bottom,transparent 0 9px,var(--ligne) 9px 10px);background-size:100% 40px;background-repeat:repeat-x;background-position:bottom}
.head h1{background:var(--fond);padding-right:12px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.78rem;font-weight:700;background:var(--teinte2);white-space:nowrap}
.chip.red{background:#fde3e7;color:#a11c33}.chip.ok{background:#dcf2e8;color:#17573f}.chip.yel{background:#fdf0c3;color:#6a4d00}
.cb{display:inline-flex;gap:5px;align-items:center;font-size:.8rem;font-weight:700;white-space:nowrap}
.cb i{width:.8em;height:.8em;border-radius:50%;display:inline-block}
.dot{display:inline-block;width:.75em;height:.75em;border-radius:3px;margin-right:6px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain>li{padding:6px 0;border-bottom:1px solid var(--ligne);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
ul.plain>li:last-child{border-bottom:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.cols>.sheet{margin:0}

/* Tableaux. */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--bord);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--teinte);font-family:var(--titre);font-weight:700;font-size:.85rem}
table.steps td:first-child{white-space:nowrap}
td.c,th.c{text-align:center}

/* Emploi du temps : la grille horaire. */
.gridw{overflow-x:auto;background:var(--papier);border:1px solid var(--bord);border-radius:10px}
.grid{position:relative;min-width:620px}
.grid .hr{position:absolute;left:0;right:0;border-top:1px solid var(--ligne);pointer-events:none}
.grid .hr span{position:absolute;left:4px;top:-.7em;font-size:.72rem;color:var(--gris);background:var(--papier);padding:0 2px}
.grid .col{position:absolute;top:0;bottom:0;border-left:1px solid var(--bord)}
.grid .col[data-a]{cursor:copy}
.grid .col.off{background:repeating-linear-gradient(135deg,var(--teinte) 0 8px,var(--papier) 8px 16px)}
.grid .colh{height:34px;display:flex;align-items:center;justify-content:center;font:700 .85rem var(--titre);border-bottom:1px solid var(--bord);background:var(--teinte)}
.grid .offl{text-align:center;color:var(--gris);font-size:.8rem;margin-top:30px}
.blk{position:absolute;border:0;border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 17%,var(--papier));border-radius:5px;padding:2px 5px;text-align:left;overflow:hidden;cursor:pointer;font-size:.76rem;line-height:1.2}
.blk b{display:block;font-family:var(--titre)}
.blk.lost{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--marge) 22%,var(--papier)) 0 6px,var(--papier) 6px 12px);border-left-color:var(--marge)}
.blk.past{opacity:.72}

/* Programmation. */
.srow .n{width:1.8em;height:1.8em;border-radius:50%;background:var(--teinte2);display:inline-grid;place-items:center;font:700 .8rem var(--titre);flex:none}
.srow.done .n{background:var(--ok);color:#fff}.srow.out .n{background:var(--marge);color:#fff}
.srow .t{flex:1;min-width:140px}
.bar{height:10px;border-radius:99px;background:var(--teinte2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}

/* Tuiles élèves. */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--papier);border:1.5px solid var(--bord);border-radius:12px;padding:12px 8px;text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;min-height:104px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tile:hover{border-color:var(--encre)}.tile:focus-visible{outline:3px solid var(--jaune)}
.tile .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 1rem var(--titre);color:#fff}
.tile b{font-size:.92rem;line-height:1.15}
.att{all:unset;cursor:pointer;width:2.3em;height:2.3em;border-radius:8px;display:inline-grid;place-items:center;font-weight:700;background:#dcf2e8;color:#17573f}
.att.A{background:var(--marge);color:#fff}.att.R{background:var(--jaune);color:#4a3600}
.att:focus-visible{outline:3px solid var(--encre)}

/* Fenêtres par-dessus la page. */
#modal,#voice{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:14px}
.ov{position:absolute;inset:0;background:rgba(20,28,60,.55)}
.dlg{position:relative;background:var(--papier);border-radius:14px;padding:18px 20px;width:min(560px,100%);max-height:92vh;overflow:auto}
.dlg h2{margin-bottom:8px}
.opt{display:block;border:1.5px solid var(--bord);border-radius:10px;padding:9px 11px;margin:8px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--encre);background:var(--teinte)}
.opt small{display:block;color:var(--gris);margin-left:1.7em}

/* La note vocale : quatre bulles autour du texte dicté. */
.vp{position:relative;width:320px;height:330px}
.vp .mid{position:absolute;inset:78px 34px;background:var(--papier);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px}
.vp .mid textarea{flex:1;font-size:.95rem}
.vp .bb{all:unset;cursor:pointer;position:absolute;width:92px;height:92px;border-radius:50%;background:var(--jaune);color:#3d2d00;display:grid;place-items:center;text-align:center;font:700 .7rem/1.15 var(--titre);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.vp .bb span{font-size:1.5rem;display:block}
.vp .bb:nth-of-type(1){left:0;top:0}.vp .bb:nth-of-type(2){right:0;top:0}.vp .bb:nth-of-type(3){left:0;bottom:0}.vp .bb:nth-of-type(4){right:0;bottom:0}
.vp .bb:focus-visible{outline:4px solid #fff}
.vp .x{all:unset;cursor:pointer;position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);color:#fff;text-decoration:underline}
.pulse{color:var(--marge);font-weight:700;animation:pu 1s infinite alternate}
@keyframes pu{to{opacity:.45}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ardoise2);color:var(--craie);padding:10px 16px;border-radius:10px;z-index:30;max-width:92vw}
.banner{background:var(--jaune);color:#3d2d00;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.step{border:1px solid var(--bord);border-radius:10px;padding:8px 10px;margin:8px 0;display:grid;grid-template-columns:90px 1fr 1fr;gap:6px 10px;background:var(--champ)}
.step label{font-size:.78rem;color:var(--gris);display:block}
.step .x{grid-column:1/-1;text-align:right}
#print{display:none}
/* Anniversaires : un bandeau discret. */
.bdays{background:color-mix(in srgb,var(--jaune) 22%,var(--papier));border-radius:10px;padding:6px 12px;margin:0 0 10px;font-size:.92rem}
/* Noter vite : gros boutons de type, petits boutons de comportement. */
.qbig{all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:96px;text-align:center;border:2px solid var(--encre);border-radius:12px;padding:10px 6px;font:700 .95rem var(--titre);background:var(--champ)}
.qbig span{display:block;font-size:1.5rem;line-height:1.2}
.qbig:hover,.qb:hover{background:var(--teinte2)}.qbig:focus-visible{outline:3px solid var(--jaune)}
.qb.pos{border-color:var(--ok)}.qb.neg{border-color:var(--marge)}
.dlg.wide{width:min(760px,100%)}
.scs{display:flex;flex-wrap:wrap;gap:6px;max-height:42vh;overflow:auto;padding:2px}
.sc{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--bord);border-radius:99px;padding:6px 12px;font-weight:700;background:var(--champ)}
.sc small{color:var(--gris);font-weight:400}
.sc[aria-pressed=true]{background:var(--encre);color:var(--papier);border-color:var(--encre)}.sc[aria-pressed=true] small{color:inherit}
.sc:focus-visible{outline:3px solid var(--jaune)}
.txtd{background:var(--teinte);border-radius:8px;padding:8px 12px;line-height:1.6}
/* Programmation : onglets de période, tableau « en ce moment ». */
.ptabs{margin-bottom:6px}table.now td{vertical-align:middle}
/* Gestion de classe. */
.btn.big{padding:12px 18px;font-size:1.05rem}
.roul{min-height:120px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-top:14px;border:2px dashed var(--bord);border-radius:14px;padding:14px;text-align:center}
.roul small{flex-basis:100%;color:var(--gris)}
.roul span{font:700 1.4rem var(--titre)}.roul .spin{font-size:2.2rem;opacity:.75}
.roul .win{font-size:2rem;background:var(--jaune);color:#3d2d00;border-radius:12px;padding:6px 16px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.roul .win{animation:none}}
.gcols{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:8px 0}
.gbox{border:1.5px solid var(--bord);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;background:var(--champ)}
.board{text-align:center;background:var(--ardoise);color:var(--craie);border-radius:6px;padding:4px;font-size:.8rem;margin:8px auto 10px;width:60%}
.plan{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:5px;overflow-x:auto}
.desk{all:unset;box-sizing:border-box;cursor:pointer;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 .82rem var(--texte);text-align:center;line-height:1.1;min-width:52px}
.desk small{font-weight:400;color:var(--gris)}
.desk.full{background:color-mix(in srgb,var(--jaune) 30%,var(--papier));border:1.5px solid color-mix(in srgb,var(--jaune) 70%,var(--encre))}
.desk.empty{border:1.5px dashed var(--bord)}
.desk.void{opacity:.25;border:1px dotted transparent}.desk.void:hover{border-color:var(--bord)}
.desk.sel{outline:3px solid var(--encre);outline-offset:1px}.desk.bad{background:color-mix(in srgb,var(--marge) 25%,var(--papier));border-color:var(--marge)}
.desk:focus-visible{outline:3px solid var(--jaune)}
/* Mots aux parents imprimés : deux par page. */
.mots .mot{white-space:normal;min-height:46vh;border-bottom:1px dashed #999;padding:10pt 0;break-inside:avoid}
/* Élèves : sélection de plusieurs tuiles, et la barre d'actions collée en bas. */
.tile{position:relative}
.tile.on{border-color:var(--encre);background:var(--teinte2);box-shadow:inset 0 0 0 2px var(--encre)}
.tile .tick{position:absolute;top:6px;right:6px;width:1.4em;height:1.4em;border-radius:50%;border:2px solid var(--bord);display:grid;place-items:center;font-weight:700;font-size:.8rem;background:var(--champ)}
.tile.on .tick{background:var(--encre);border-color:var(--encre);color:var(--papier)}
.selbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;margin-top:14px;background:var(--papier);border:2px solid var(--encre);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.dt:disabled{opacity:.45;cursor:not-allowed}
/* Difficultés à reprendre, sur une séance. */
.difb{border-left:4px solid var(--jaune);background:color-mix(in srgb,var(--jaune) 14%,var(--papier));border-radius:6px;padding:6px 10px;margin:8px 0}
#voice .dlg{z-index:1}
/* Programmation : tuiles par matière, puis blocs de séances repliables. */
.pts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:6px}
.pt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:4px;background:var(--papier);border:1.5px solid var(--bord);border-left:6px solid var(--c);border-radius:10px;padding:9px 10px;min-width:0}
.pt b{font-family:var(--titre);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt[aria-pressed=true]{border-color:var(--encre);border-left-color:var(--c);background:var(--teinte2);box-shadow:inset 0 0 0 1px var(--encre)}
.pt:focus-visible,.pbh:focus-visible{outline:3px solid var(--jaune)}
.pb{background:var(--papier);border:1px solid var(--bord);border-radius:10px;margin:0 0 8px;padding:0 12px}
.pb.open{border-color:var(--encre);padding-bottom:8px}
.pbh{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%;padding:11px 0}
.pbh b{font-family:var(--titre)}.pbh .car{width:1em;color:var(--gris)}
/* Fenêtre d'un créneau : petites étiquettes à toucher, et tuiles « où va la séance ». */
.qb{all:unset;cursor:pointer;border:1.5px solid var(--bord);border-radius:99px;padding:3px 10px;font-size:.84rem;font-weight:700;background:var(--champ)}
.dts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin:8px 0}
.dt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--bord);border-left:5px solid var(--c);border-radius:9px;padding:6px 8px;font-size:.84rem;line-height:1.2;background:var(--champ);min-width:0}
.dt b{display:block;font-family:var(--titre);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dt small{color:var(--gris)}
.qb[aria-pressed=true],.dt[aria-pressed=true]{border-color:var(--encre);background:var(--teinte2);box-shadow:inset 0 0 0 1px var(--encre)}
.qb:focus-visible,.dt:focus-visible{outline:3px solid var(--jaune)}
/* Agenda hors classe : une plage de temps de classe repliée. */
.grid .foldb{position:absolute;left:0;right:0;z-index:2;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--gris);
  background:repeating-linear-gradient(135deg,var(--teinte2) 0 6px,var(--papier) 6px 12px);border-top:1px dashed var(--bord);border-bottom:1px dashed var(--bord)}
/* …ou, si la plage reste ouverte, la zone « en classe » d'une colonne. */
.grid .foldc{position:absolute;z-index:1;pointer-events:none;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--gris);overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--teinte2) 0 6px,transparent 6px 12px)}
.grid .foldc span,.grid .foldb span{background:var(--papier);padding:0 8px;border-radius:99px}
/* Le bouton qui remplace les champs date et heure, et son sélecteur. */
.pk{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--bord);border-radius:7px;padding:6px 10px;background:var(--champ);white-space:nowrap;min-width:8.5em}
.pk:hover{border-color:var(--encre)}.pk:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}
.fld .pk{display:block;width:100%}
#pick{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:14px}
.pkp{position:relative;background:var(--papier);border-radius:16px;padding:14px;width:min(340px,100%)}
.pkm{text-align:center;font:700 1.05rem var(--titre)}.pkm::first-letter{text-transform:uppercase}
.pkt{text-align:center;font:700 1.9rem var(--titre);margin:0 0 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal i{font-style:normal;text-align:center;font-size:.75rem;color:var(--gris);font-weight:700}
.tg{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:5px}
.cal button,.tg button{all:unset;cursor:pointer;text-align:center;border-radius:9px;padding:9px 0;font-weight:700;background:var(--teinte)}
.cal button.off{background:none;color:var(--gris);font-weight:400}
.cal button.today{box-shadow:inset 0 0 0 2px var(--marge)}
.cal button:hover,.tg button:hover{background:var(--teinte2)}
.cal button.sel,.tg button.sel{background:var(--encre);color:var(--papier)}
.cal button:focus-visible,.tg button:focus-visible{outline:3px solid var(--jaune)}
/* Réglages › Apparence : les pastilles de palette. */
.pal{all:unset;cursor:pointer;border:2px solid var(--bord);border-radius:10px;padding:6px 8px;text-align:center;font-size:.8rem;font-weight:700}
.pal[aria-pressed=true]{border-color:var(--encre);background:var(--teinte)}.pal:focus-visible{outline:3px solid var(--jaune)}
.pal span{display:flex;border-radius:6px;overflow:hidden;margin-bottom:4px;border:1px solid var(--bord)}.pal i{width:18px;height:22px;display:block}
input[type=color]{padding:2px;width:3.2em;height:2.2em}

/* Téléphone : le menu passe en bas, la marge du cahier se resserre. */
@media (max-width:820px){
  body{display:block}
  #nav{grid-row:auto;position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:10;gap:0}
  #nav .logo{display:none}
  #nav button{flex-direction:column;gap:0;font-size:.66rem;padding:5px 9px;white-space:nowrap}
  #nav .ic{font-size:1.25rem}
  #top{padding:8px 12px}
  #main{padding:14px 12px 96px}
  .selbar{bottom:calc(env(safe-area-inset-bottom,0px) + 74px)}
  .sheet{padding:12px 12px 12px 58px}.sheet::before{left:48px}.sheet>.mg{width:46px;font-size:.74rem}
  .step{grid-template-columns:1fr}
  table.steps thead{display:none}
  table.steps,table.steps tbody,table.steps tr,table.steps td{display:block;border:0;padding:0}
  table.steps tr{border:1px solid var(--bord);border-radius:8px;padding:8px;margin:6px 0}
  table.steps td[data-l]::before{content:attr(data-l) " : ";font-weight:700;font-size:.8rem;color:var(--gris)}
  table.steps td:empty{display:none}
}

/* Impression : on ne garde que le contenu. */
/* Impressions en paysage : programmation annuelle et progression. */
@page paysage{size:A4 landscape;margin:9mm}
@media print{
  #print .land{page:paysage}
  #print .ptab{font-size:7.5pt;table-layout:fixed}#print .ptab th,#print .ptab td{padding:3px 4px;vertical-align:top}
  #print .ptab tbody th{width:12%;text-align:left}#print .ptab .pc{margin:0 0 3px;break-inside:avoid}
  :root{--papier:#fff!important;--fond:#fff!important;--encre:#14204d!important;--champ:#fff!important;--marge:#b3122c!important;--taille:16px!important;color-scheme:light!important}
  body{display:block;background:#fff;font-size:11pt}
  #nav,#top,#modal,#voice,#pick,#toast,.np,.banner{display:none!important}
  #main{padding:0;max-width:none}
  .sheet{border:0;padding:0 0 0 0;margin-bottom:12pt;break-inside:avoid-page}.sheet::before{display:none}
  .sheet>.mg{position:static;width:auto;text-align:left;float:left;margin-right:8pt}
  .head{background:none;border-bottom:1.5pt solid #000}.head h1{background:none}
  .gridw{overflow:visible;border:0}.grid{min-width:0}
  .desk,.board,.pt,.pb,.blk,.chip,.att,th,.srow .n,.bar,.bar i,.tile .av,.dot,.cb i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{overflow:visible}
  body.pdoc #main{display:none}
  body.pdoc #print{display:block}
  #print h1{font-size:16pt;margin-bottom:6pt}#print h2{font-size:12.5pt;margin:12pt 0 4pt;border-bottom:1pt solid #000}
  #print .blank{border:1pt solid #999;min-height:60pt;margin:4pt 0}
  #print td.w{height:22pt}
  #print .pb{break-before:page}
  table.steps thead{display:table-header-group}
}
</style>
</head>

<nav id="nav" aria-label="Menu"></nav>
<header id="top"></header>
<main id="main"></main>
<div id="modal" hidden></div>
<div id="voice" hidden></div>
<div id="pick" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="print"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="core.js"></script>
<script src="vues-a.js"></script>
<script src="vues-b.js"></script>

</script>
