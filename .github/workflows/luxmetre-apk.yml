name: APK Luxmètre

on:
  push:
    paths: ['luxmetre/**', '.github/workflows/luxmetre-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compiler l'APK
        working-directory: luxmetre
        run: gradle assembleDebug --no-daemon
      - run: cp luxmetre/app/build/outputs/apk/debug/app-debug.apk luxmetre.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luxmetre-apk
          path: luxmetre.apk
      - name: Publier en release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: luxmetre-v${{ github.run_number }}
          name: Luxmètre (build ${{ github.run_number }})
          body: Appli Android qui affiche la luminosité ambiante en lux. Télécharger luxmetre.apk ci-dessous.
          files: luxmetre.apk
