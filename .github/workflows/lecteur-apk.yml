name: APK Lecteur

on:
  push:
    paths:
      - 'lecteur-android/**'
      - '.github/workflows/lecteur-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# Une compilation à la fois (la clé de signature est créée une seule fois)
concurrency:
  group: lecteur-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecteur-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Dernière version de NewPipeExtractor
        id: npe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest | jq -r .tag_name || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then TAG=v0.24.8; fi
          echo "NewPipeExtractor $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Clé de signature fixe, gardée d'une compilation à l'autre (sinon Android
      # refuse d'installer la mise à jour par-dessus l'ancienne version)
      - uses: actions/cache@v4
        with:
          path: ~/.lecteur/signing.keystore
          key: lecteur-signing-v1

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.LECTEUR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LECTEUR_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$HOME/.lecteur"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/.lecteur/secret.keystore"
            echo "LECTEUR_KEYSTORE=$HOME/.lecteur/secret.keystore" >> "$GITHUB_ENV"
            echo "LECTEUR_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          else
            KS="$HOME/.lecteur/signing.keystore"
            if [ ! -f "$KS" ]; then
              echo "Création de la clé de signature"
              keytool -genkeypair -keystore "$KS" -alias lecteur -keyalg RSA -keysize 2048 \
                -validity 20000 -storepass lecteur-ci -keypass lecteur-ci -dname "CN=Lecteur"
            else
              echo "Clé de signature réutilisée"
            fi
            echo "LECTEUR_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "LECTEUR_KEYSTORE_PASSWORD=lecteur-ci" >> "$GITHUB_ENV"
          fi

      - name: Compilation
        run: gradle assembleRelease --stacktrace -PnpeVersion=${{ steps.npe.outputs.tag }} -PversionCode=${{ github.run_number }}

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk lecteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lecteur-apk
          path: lecteur-android/lecteur.apk

      - name: Publier (release « lecteur »)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lecteur
          name: Lecteur (dernière compilation)
          prerelease: true
          make_latest: false
          body: "APK compilé depuis ${{ github.sha }} avec NewPipeExtractor ${{ steps.npe.outputs.tag }}."
          files: lecteur-android/lecteur.apk
