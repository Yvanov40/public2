name: APK Lecteur

on:
  push:
    paths:
      - 'lecteur-android/**'
      - '.github/workflows/lecteur-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lecteur-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Dernière version de NewPipeExtractor
        id: npe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest | jq -r .tag_name || true)
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then TAG=v0.24.8; fi
          echo "NewPipeExtractor $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Clé de debug conservée en cache pour que les mises à jour s'installent par-dessus
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lecteur-debug-keystore

      - name: Clé de signature (secret facultatif)
        env:
          KS_B64: ${{ secrets.LECTEUR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/lecteur.keystore"
            echo "LECTEUR_KEYSTORE=$RUNNER_TEMP/lecteur.keystore" >> "$GITHUB_ENV"
          fi

      - name: Compilation
        env:
          LECTEUR_KEYSTORE_PASSWORD: ${{ secrets.LECTEUR_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --stacktrace -PnpeVersion=${{ steps.npe.outputs.tag }} -PversionCode=${{ github.run_number }}

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk lecteur.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lecteur-apk
          path: lecteur-android/lecteur.apk

      - name: Publier (release « lecteur »)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lecteur
          name: Lecteur (dernière compilation)
          prerelease: true
          make_latest: false
          body: "APK compilé depuis ${{ github.sha }} avec NewPipeExtractor ${{ steps.npe.outputs.tag }}."
          files: lecteur-android/lecteur.apk
