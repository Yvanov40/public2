plugins {
    id 'com.android.application' version '8.11.1'
}

// Version unique, partagée avec construire.sh
def version = new Properties()
file('version.properties').withInputStream { version.load(it) }

android {
    namespace 'fr.liseuse'
    compileSdk 36

    defaultConfig {
        // Identifiant sur le Play Store : DÉFINITIF une fois l'appli publiée.
        // (L'édition complète construite avec construire.sh garde « fr.liseuse » : les deux peuvent cohabiter.)
        applicationId 'fr.liseuse.lecteur'
        minSdk 24
        targetSdk 36
        versionCode version.versionCode as int
        versionName version.versionName
    }

    // Arborescence du projet (identique à celle de construire.sh) + achats Google Play
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', 'src-play']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    // Clé d'envoi (« upload key ») fournie par les variables d'environnement de la construction
    signingConfigs {
        publication {
            def ks = System.getenv('LISEUSE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('LISEUSE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('LISEUSE_KEY_ALIAS')
                keyPassword System.getenv('LISEUSE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('LISEUSE_KEYSTORE')) signingConfig signingConfigs.publication
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Le dossier build/ sert déjà à construire.sh
layout.buildDirectory = file('build-gradle')

dependencies {
    implementation 'com.android.billingclient:billing:8.0.0'
}
